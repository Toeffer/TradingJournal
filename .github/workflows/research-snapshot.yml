name: Research Snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/scanner_signals.csv
      - data/market_regime.csv
      - scripts/build_research_snapshot.py

concurrency:
  group: research-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build normalized snapshot
        run: python scripts/build_research_snapshot.py

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research_snapshot.csv data/research_snapshot.meta.json
          if git diff --cached --quiet; then
            echo "Research snapshot is unchanged."
          else
            git commit -m "Refresh research snapshot"
            git pull --rebase origin main
            git push origin main
          fi
