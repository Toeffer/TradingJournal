name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install quality tools
        run: python -m pip install --upgrade "pytest>=8.2,<9" "ruff>=0.6,<1"

      - name: Compile Python sources
        run: python -m compileall -q scanner scripts tests

      - name: Lint
        run: ruff check scanner scripts tests

      - name: Test
        run: pytest -q

      - name: Validate repository data
        run: python scripts/validate_data.py

      - name: Validate candidate evidence manifests
        run: python scripts/validate_candidate_manifest.py --all

      - name: Validate rolling recommendations
        run: python scripts/validate_recommendations.py

      - name: Verify recommendation book is current
        run: |
          python scripts/summarize_recommendations.py
          git diff --exit-code -- research/recommendation-book.md
