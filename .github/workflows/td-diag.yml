# TEMPORARY diagnostic workflow for Twelve Data symbol addressing.
# Delete together with scanner/td_diag.py once the EU scanner's
# Twelve Data source is confirmed working.
name: Twelve Data Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe Twelve Data addressing forms
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python scanner/td_diag.py
