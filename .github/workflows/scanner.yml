name: Pump Scanner

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC and can be delayed. Each cron fires about 5 minutes before
    # the intended Berlin wall-clock scan time; the job waits until the target.
    # Both CEST and CET offsets are listed and the wrong-season duplicate is skipped.
    - cron: "45 13 * * 1-5"  # 15:50 Berlin CEST
    - cron: "05 14 * * 1-5"  # 16:10 Berlin CEST
    - cron: "40 14 * * 1-5"  # 16:45 Berlin CEST
    - cron: "25 15 * * 1-5"  # 17:30 Berlin CEST
    - cron: "10 19 * * 1-5"  # 21:15 Berlin CEST
    - cron: "45 14 * * 1-5"  # 15:50 Berlin CET
    - cron: "05 15 * * 1-5"  # 16:10 Berlin CET
    - cron: "40 15 * * 1-5"  # 16:45 Berlin CET
    - cron: "25 16 * * 1-5"  # 17:30 Berlin CET
    - cron: "10 20 * * 1-5"  # 21:15 Berlin CET

concurrency:
  group: pump-scanner
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait until target Berlin scan time
        id: timing
        if: github.event_name == 'schedule'
        env:
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          case "$TRIGGER_CRON" in
            "45 13 * * 1-5") TARGET_HHMM="15:50"; CRON_SEASON="CEST" ;;
            "05 14 * * 1-5") TARGET_HHMM="16:10"; CRON_SEASON="CEST" ;;
            "40 14 * * 1-5") TARGET_HHMM="16:45"; CRON_SEASON="CEST" ;;
            "25 15 * * 1-5") TARGET_HHMM="17:30"; CRON_SEASON="CEST" ;;
            "10 19 * * 1-5") TARGET_HHMM="21:15"; CRON_SEASON="CEST" ;;
            "45 14 * * 1-5") TARGET_HHMM="15:50"; CRON_SEASON="CET" ;;
            "05 15 * * 1-5") TARGET_HHMM="16:10"; CRON_SEASON="CET" ;;
            "40 15 * * 1-5") TARGET_HHMM="16:45"; CRON_SEASON="CET" ;;
            "25 16 * * 1-5") TARGET_HHMM="17:30"; CRON_SEASON="CET" ;;
            "10 20 * * 1-5") TARGET_HHMM="21:15"; CRON_SEASON="CET" ;;
            *) echo "Unknown schedule '$TRIGGER_CRON'; running without wait."; echo "should_run=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          case "$(TZ=Europe/Berlin date +%z)" in
            "+0200") CURRENT_SEASON="CEST" ;;
            "+0100") CURRENT_SEASON="CET" ;;
            *) CURRENT_SEASON="$CRON_SEASON" ;;
          esac
          if [ "$CRON_SEASON" != "$CURRENT_SEASON" ]; then
            echo "Wrong-season duplicate cron; skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BERLIN_DATE=$(TZ=Europe/Berlin date +%Y-%m-%d)
          NOW_EPOCH=$(TZ=Europe/Berlin date +%s)
          TARGET_EPOCH=$(TZ=Europe/Berlin date -d "$BERLIN_DATE $TARGET_HHMM:00" +%s)
          DIFF_SECONDS=$((TARGET_EPOCH - NOW_EPOCH))
          MAX_EARLY_WAIT_SECONDS=900
          MAX_LATE_RUN_SECONDS=12600
          if [ "$DIFF_SECONDS" -gt 0 ] && [ "$DIFF_SECONDS" -le "$MAX_EARLY_WAIT_SECONDS" ]; then
            sleep "$DIFF_SECONDS"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$DIFF_SECONDS" -gt "$MAX_EARLY_WAIT_SECONDS" ]; then
            echo "Unexpectedly early; running immediately."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LATE_SECONDS=$((0 - DIFF_SECONDS))
          if [ "$LATE_SECONDS" -gt "$MAX_LATE_RUN_SECONDS" ]; then
            echo "Run is too stale for this slot; skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Running $LATE_SECONDS seconds after target."
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        if: steps.timing.outputs.should_run != 'false'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        if: steps.timing.outputs.should_run != 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run scanner
        id: scanner
        if: steps.timing.outputs.should_run != 'false'
        continue-on-error: true
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: |
          set +e
          OUTPUT=$(python scanner/run_scan_safe.py 2>&1)
          STATUS=$?
          set -e
          printf '%s\n' "$OUTPUT"
          if [ "$STATUS" -ne 0 ] || printf '%s' "$OUTPUT" | grep -Eq 'without market data|after data error|Data fetch failed'; then
            echo "Scanner produced a diagnostic report but no valid market-data run."
            exit 1
          fi

      - name: Backfill scanner returns
        if: steps.timing.outputs.should_run != 'false' && steps.scanner.outcome == 'success'
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python scanner/backfill_returns.py

      - name: Summarize signal outcomes
        if: steps.timing.outputs.should_run != 'false' && steps.scanner.outcome == 'success'
        run: python scanner/summarize_signals.py

      - name: Simulate proposal outcomes
        if: steps.timing.outputs.should_run != 'false' && steps.scanner.outcome == 'success'
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python scanner/simulate_proposals.py

      - name: Draft proposal cards from alerts
        if: steps.timing.outputs.should_run != 'false' && steps.scanner.outcome == 'success'
        run: python scanner/draft_proposals.py

      - name: Refresh research snapshot
        if: steps.timing.outputs.should_run != 'false' && steps.scanner.outcome == 'success'
        run: python scripts/build_research_snapshot.py

      - name: Validate source data
        if: steps.timing.outputs.should_run != 'false' && steps.scanner.outcome == 'success'
        run: python scripts/validate_data.py

      - name: Commit scanner output
        if: always() && steps.timing.outputs.should_run != 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in data/scanner_signals.csv data/market_regime.csv data/research_snapshot.csv data/research_snapshot.meta.json data/proposals.csv data/finviz_watchlist.csv data/finviz_watchlist_archive.csv research/scans research/scanner-summary.md research/proposal-stats.md research/proposal-drafts.md; do
            [ -e "$path" ] && git add "$path"
          done
          if git diff --cached --quiet; then
            echo "No scanner output changes to commit."
          else
            git commit -m "Record scanner output"
            git pull --rebase origin "${{ github.ref_name }}"
            git push -u origin "${{ github.ref_name }}"
          fi

      - name: Mark failed market-data run
        if: steps.scanner.outcome == 'failure'
        run: exit 1
