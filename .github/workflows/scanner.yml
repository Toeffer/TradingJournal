name: Pump Scanner

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC and does not follow DST, so both a CEST-offset and a
    # CET-offset set of crons are listed below targeting the same Berlin wall-clock
    # times (15:50 / 16:10 / 16:45 / 17:30 / 21:15). Whichever set doesn't match the
    # current Berlin offset just fires an hour off from the intended local time
    # instead of silently drifting all season - runs are non-destructive and
    # deduplicated in scanner_signals.csv, so the extra/off-target runs are harmless.
    #
    # CEST (UTC+2, roughly late Mar - late Oct):
    - cron: "50 13 * * 1-5"  # 15:50 Europe/Berlin during CEST
    - cron: "10 14 * * 1-5"  # 16:10 Europe/Berlin during CEST
    - cron: "45 14 * * 1-5"  # 16:45 Europe/Berlin during CEST
    - cron: "30 15 * * 1-5"  # 17:30 Europe/Berlin during CEST
    - cron: "15 19 * * 1-5"  # 21:15 Europe/Berlin during CEST
    # CET (UTC+1, roughly late Oct - late Mar):
    - cron: "50 14 * * 1-5"  # 15:50 Europe/Berlin during CET
    - cron: "10 15 * * 1-5"  # 16:10 Europe/Berlin during CET
    - cron: "45 15 * * 1-5"  # 16:45 Europe/Berlin during CET
    - cron: "30 16 * * 1-5"  # 17:30 Europe/Berlin during CET
    - cron: "15 20 * * 1-5"  # 21:15 Europe/Berlin during CET

concurrency:
  group: pump-scanner
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run scanner
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python scanner/run_scan.py

      - name: Backfill scanner returns
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python scanner/backfill_returns.py

      - name: Commit scanner output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scanner_signals.csv research/scans/
          if git diff --cached --quiet; then
            echo "No scanner output changes to commit."
          else
            git commit -m "Record scanner output"
            git pull --rebase origin "${{ github.ref_name }}"
            git push -u origin "${{ github.ref_name }}"
          fi
