name: EU Scanner

on:
  workflow_dispatch:
    inputs:
      seed_history:
        description: "One-time: backfill EU daily history from Stooq before scanning"
        type: boolean
        default: false
  schedule:
    # XETRA session is 09:00-17:30 Europe/Berlin. Crons fire ~5 min before the
    # intended Berlin times (09:20 / 11:20 / 15:10 / 17:40); the timing step
    # waits when early and still runs when GitHub is late (see scanner.yml for
    # the rationale). The 17:40 post-close run finalizes the day's bar in the
    # self-accumulated EU history. Both DST offsets are listed.
    #
    # CEST (UTC+2):
    - cron: "15 7 * * 1-5"   # target 09:20 Berlin during CEST
    - cron: "15 9 * * 1-5"   # target 11:20 Berlin during CEST
    - cron: "05 13 * * 1-5"  # target 15:10 Berlin during CEST
    - cron: "35 15 * * 1-5"  # target 17:40 Berlin during CEST
    # CET (UTC+1):
    - cron: "15 8 * * 1-5"   # target 09:20 Berlin during CET
    - cron: "15 10 * * 1-5"  # target 11:20 Berlin during CET
    - cron: "05 14 * * 1-5"  # target 15:10 Berlin during CET
    - cron: "35 16 * * 1-5"  # target 17:40 Berlin during CET

concurrency:
  # Shared with the US scanner workflow so both never write
  # data/scanner_signals.csv at the same time.
  group: pump-scanner
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan-eu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait until target Berlin scan time
        id: timing
        if: github.event_name == 'schedule'
        env:
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          case "$TRIGGER_CRON" in
            "15 7 * * 1-5")  TARGET_HHMM="09:20"; CRON_SEASON="CEST" ;;
            "15 9 * * 1-5")  TARGET_HHMM="11:20"; CRON_SEASON="CEST" ;;
            "05 13 * * 1-5") TARGET_HHMM="15:10"; CRON_SEASON="CEST" ;;
            "35 15 * * 1-5") TARGET_HHMM="17:40"; CRON_SEASON="CEST" ;;
            "15 8 * * 1-5")  TARGET_HHMM="09:20"; CRON_SEASON="CET" ;;
            "15 10 * * 1-5") TARGET_HHMM="11:20"; CRON_SEASON="CET" ;;
            "05 14 * * 1-5") TARGET_HHMM="15:10"; CRON_SEASON="CET" ;;
            "35 16 * * 1-5") TARGET_HHMM="17:40"; CRON_SEASON="CET" ;;
            *)
              echo "Unknown schedule '$TRIGGER_CRON'; running without wait."
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          case "$(TZ=Europe/Berlin date +%z)" in
            "+0200") CURRENT_SEASON="CEST" ;;
            "+0100") CURRENT_SEASON="CET" ;;
            *) CURRENT_SEASON="$CRON_SEASON" ;;
          esac

          echo "Schedule: $TRIGGER_CRON (intended for $CRON_SEASON)"
          echo "Berlin now: $(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M:%S %Z') (season $CURRENT_SEASON)"
          echo "Target Berlin scan time: $TARGET_HHMM"

          if [ "$CRON_SEASON" != "$CURRENT_SEASON" ]; then
            echo "Wrong-season duplicate cron; the $CURRENT_SEASON cron covers this slot. Skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BERLIN_DATE=$(TZ=Europe/Berlin date +%Y-%m-%d)
          NOW_EPOCH=$(TZ=Europe/Berlin date +%s)
          TARGET_EPOCH=$(TZ=Europe/Berlin date -d "$BERLIN_DATE $TARGET_HHMM:00" +%s)
          DIFF_SECONDS=$((TARGET_EPOCH - NOW_EPOCH))
          MAX_EARLY_WAIT_SECONDS=900
          MAX_LATE_RUN_SECONDS=12600

          if [ "$DIFF_SECONDS" -gt 0 ] && [ "$DIFF_SECONDS" -le "$MAX_EARLY_WAIT_SECONDS" ]; then
            echo "Waiting $DIFF_SECONDS seconds until target scan time."
            sleep "$DIFF_SECONDS"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$DIFF_SECONDS" -gt "$MAX_EARLY_WAIT_SECONDS" ]; then
            echo "Unexpectedly early ($DIFF_SECONDS s before target); running immediately without wait."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATE_SECONDS=$((0 - DIFF_SECONDS))
          if [ "$LATE_SECONDS" -gt "$MAX_LATE_RUN_SECONDS" ]; then
            echo "Triggered $LATE_SECONDS seconds after target (> $MAX_LATE_RUN_SECONDS); too stale for this slot. Skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Running $LATE_SECONDS seconds after target (late-but-valid; rel volume normalizes by session time)."
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        if: steps.timing.outputs.should_run != 'false'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        if: steps.timing.outputs.should_run != 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Seed EU history from Stooq (manual, one-time)
        if: github.event_name == 'workflow_dispatch' && inputs.seed_history
        run: python scanner/seed_eu_history.py

      - name: Run EU scanner
        if: steps.timing.outputs.should_run != 'false'
        env:
          # Source chain (first configured/working source wins):
          # FMP -> Twelve Data -> Stooq (blocked on GitHub runners) -> Yahoo.
          # Both keys are optional; without any, scans run on Yahoo.
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python scanner/run_scan_eu.py

      - name: Backfill scanner returns
        if: steps.timing.outputs.should_run != 'false'
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python scanner/backfill_returns.py

      - name: Summarize signal outcomes
        if: steps.timing.outputs.should_run != 'false'
        run: python scanner/summarize_signals.py

      - name: Simulate proposal outcomes
        if: steps.timing.outputs.should_run != 'false'
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python scanner/simulate_proposals.py

      - name: Draft proposal cards from alerts
        if: steps.timing.outputs.should_run != 'false'
        run: python scanner/draft_proposals.py

      - name: Commit scanner output
        if: steps.timing.outputs.should_run != 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Some outputs only exist after a successful data fetch; adding a
          # missing pathspec is a fatal git error, so add only what exists.
          for path in data/scanner_signals.csv data/eu_quote_history.csv data/proposals.csv research/scans research/scanner-summary.md research/proposal-stats.md research/proposal-drafts.md; do
            [ -e "$path" ] && git add "$path"
          done
          if git diff --cached --quiet; then
            echo "No scanner output changes to commit."
          else
            git commit -m "Record EU scanner output"
            git pull --rebase origin "${{ github.ref_name }}"
            git push -u origin "${{ github.ref_name }}"
          fi
