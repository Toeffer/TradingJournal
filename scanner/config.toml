# TradingJournal scanner configuration
# Purpose: discover and measure unusual-volume / breakout candidates.
# This is NOT an auto-trading config and does not create trades in trades.csv.

[scanner]
timezone = "Europe/Berlin"
# 2026-07-01: reverted to 60 now that relative volume is normalized against the
# elapsed fraction of the US session instead of the full-day average (see
# session_elapsed_fraction in run_scan.py). The old raw comparison made rel_volume
# nearly unreachable mid-session, which is why nothing cleared 60 before.
min_score_to_record = 60
min_score_to_alert = 70
max_candidates_per_report = 10
# Research snapshots retain only recent scanner observations. Old observations stay
# in scanner_signals.csv for measurement but are not fed into current weekly research.
research_snapshot_lookback_days = 7
# Manual screenshot/watchlist seeds are optional discovery context, never alpha.
# Rows without an explicit expires_at are active for at most this many calendar days.
finviz_seed_max_age_days = 2

[universe]
# Starter list used for the API scan. Keep this intentionally modest while learning.
file = "scanner/universe.txt"
# Optional manual input from Finviz free screener. Put one ticker per row under a `ticker` column.
finviz_manual_file = "data/finviz_watchlist.csv"

[alpaca]
# Free tier can use IEX data. Upgrade later only if the journal proves the scanner is useful.
# NOTE: all volume/avg_volume_20d/min_avg_volume_20d figures are IEX-only volume, a
# minority of consolidated U.S. tape, not full-market volume. Thresholds below are
# calibrated in IEX terms; don't read them as real total liquidity.
base_url = "https://data.alpaca.markets"
feed = "iex"
batch_size = 50
# 150 calendar days ≈ 103 trading bars: enough warm-up for the measurement-only
# EMA50/MACD indicator columns (90 gave only ~62 bars, a barely-seeded EMA50).
# Stays under Alpaca's 10k-bars-per-request page limit at batch_size 50.
lookback_days = 150

[eu]
# EU scanner (run_scan_eu.py): FMP real-time quotes + self-accumulating local
# history (data/eu_quote_history.csv), because the current FMP plan has no EU
# historical bars. Breakout/rel-volume components come online as history grows.
universe_file = "scanner/universe_eu.txt"
base_url = "https://financialmodelingprep.com"
# A field called 20-day high must have 20 completed sessions behind it.
min_history_days_for_breakout = 20

[eu.twelvedata]
# Twelve Data free (Basic) plan: 8 API credits/minute, 800/day; one symbol in
# a quote batch = one credit. The scanner sends batches of this size with a
# ~60s pause between them (46 tickers ≈ 6 min/scan, ~184 credits across the 4
# daily runs). Raise this only after upgrading the Twelve Data plan.
credits_per_minute = 8

[eu.filters]
min_price = 2.0
max_price = 2000.0        # EUR; XETRA has four-digit names (e.g. RHM)
min_change_pct = 3.0
max_change_pct = 15.0
min_rel_volume = 2.0
max_extension_5d_pct = 25.0
min_avg_volume_20d = 100000  # shares; XETRA volumes run lower than US consolidated

[filters]
min_price = 2.0
max_price = 500.0
min_change_pct = 3.0
max_change_pct = 15.0
min_rel_volume = 2.0
max_extension_5d_pct = 25.0
min_avg_volume_20d = 300000

[score]
# NOTE: the indicator columns (rsi14, ema20/50 distance, macd_hist_pct,
# bb_percent_b) and the cross-asset regime columns are measurement-only —
# they carry no weight here by design. Promoting one into the score requires
# the bucket evaluation to show it separates forward returns (MASTERPLAN
# Phase 1) and is a phase-transition decision with a changelog entry.
rel_volume = 20
break_20d_high = 15
daily_change = 10
close_above_open = 5
# Manual Finviz membership must never alter the quantitative score. The field is
# retained at zero for backward-compatible config loading and old reports.
finviz_seed = 0
liquidity = 10
not_overextended = 10
