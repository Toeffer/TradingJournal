# Executable learning-phase rules.
# RISK_RULES.md remains the human-readable explanation; scripts read this file so
# limits are not duplicated as Python constants.

[learning_phase]
max_open_positions = 5
max_per_sector = 2
max_position_size_eur = 150.0
binary_event_max_position_size_eur = 75.0
max_total_position_value_eur = 750.0
daily_loss_limit_r = -2.0
weekly_loss_limit_r = -4.0
consecutive_loss_count = 3
pause_days_after_consecutive_losses = 3
proposal_min_planned_r = 1.5

[horizons]
# A proposal is a swing setup, not a six-week prediction. Ten trading sessions is
# the default mechanical holding period. A shorter value can be set per proposal.
default_proposal_holding_days = 10

# Candidates with a verified catalyst inside 21 calendar days may enter the
# actionable weekly shortlist. Days 22-42 are an early-watch pool only.
actionable_catalyst_days = 21
discovery_catalyst_days = 42

# Scanner forward returns retain 21 trading days as a slow diagnostic horizon,
# but 1/3/5/10-day results are the primary evaluation horizons.
scanner_primary_horizons = [1, 3, 5, 10]
scanner_context_horizon = 21
