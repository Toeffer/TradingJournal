[project]
name = "trading-journal"
version = "0.1.0"
description = "Personal trading journal, scanner, and process-measurement tooling"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scanner", "scripts"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]
