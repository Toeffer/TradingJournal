[project]
name = "trading-journal"
version = "0.1.0"
description = "Personal trading journal, scanner, and process-measurement tooling"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scanner", "scripts"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Begin with syntax/undefined-name correctness. Broader style cleanup can be
# introduced separately without blocking the reliability work on legacy files.
select = ["E9", "F63", "F7", "F82"]
ignore = ["E501"]
